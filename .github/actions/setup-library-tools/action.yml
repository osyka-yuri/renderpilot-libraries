name: Setup library catalog tooling
description: Install the repository-pinned Node.js and pnpm toolchain

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        # pnpm 11.12.0 currently breaks action-setup's self-installer:
        # https://github.com/pnpm/action-setup/issues/276
        version: 11.11.0
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: pnpm
