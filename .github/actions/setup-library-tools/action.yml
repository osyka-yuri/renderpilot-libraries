name: Setup library catalog tooling
description: Install the repository-pinned Node.js and pnpm toolchain

inputs:
  install:
    description: Whether pnpm/setup runs pnpm install automatically
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        runtime: node@24.21.0
        cache: true
        require-lockfile: true
        install: ${{ inputs.install }}
