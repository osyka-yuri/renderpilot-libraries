name: Wiki drift

# Notify-only: run RenoDX + Luma wiki --check on a schedule. On real catalogue
# drift, upsert a dedicated GitHub Issue. On clean check, close that Issue.
# Soft network failures do not open issues. Never writes wiki snapshots or PRs.
# Not part of the default PR `check` suite (PR CI already runs sync:*-wiki:check).

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wiki-drift
  cancel-in-progress: false

jobs:
  check:
    name: Wiki drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm and Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true
      - name: Check wiki drift and notify
        run: pnpm run check:wiki-drift:notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
