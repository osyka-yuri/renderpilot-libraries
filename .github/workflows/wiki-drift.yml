name: Wiki drift

# Notify-only: run RenoDX + Luma wiki --check on a schedule. On real catalogue
# drift, upsert a dedicated GitHub Issue. On clean check, close that Issue.
# Soft network failures do not open issues. Never writes wiki snapshots or PRs.
# Not part of the default PR `check` suite (PR CI already runs sync:*-wiki:check).

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wiki-drift
  cancel-in-progress: false

jobs:
  check:
    name: Wiki drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check wiki drift and notify
        run: pnpm run check:wiki-drift:notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
