name: GitHub library releases refresh

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      materialize_locked:
        description: "Re-verify and rematerialize every locked release"
        required: false
        type: boolean
        default: false

concurrency:
  group: github-release-tree-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Import stable GitHub SDK releases
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify Windows Authenticode and PE tooling
        run: pnpm run test:authenticode

      - name: Detect every missing stable release across registered GitHub sources
        id: detect
        run: pnpm run refresh:github:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import, verify, and compress all missing releases as one catalog update
        if: success() && steps.detect.outputs.status == 'update_available'
        run: pnpm run refresh:github:write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore every locked payload without changing its identity
        if: success() && inputs.materialize_locked
        run: pnpm run materialize:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and validate the public catalog
        if: success() && (steps.detect.outputs.status == 'update_available' || inputs.materialize_locked)
        run: |
          pnpm run libraries:generate
          pnpm run libraries:check
          pnpm run validate
          pnpm run validate:github

      - name: Publish immutable assets and verify R2 metadata
        if: success() && (steps.detect.outputs.status == 'update_available' || inputs.materialize_locked)
        run: pnpm run publish:assets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Open catalog pull request
        if: success() && (steps.detect.outputs.status == 'update_available' || inputs.materialize_locked)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/github-libraries-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(libraries): refresh GitHub SDK catalogs"
          title: "chore(libraries): refresh GitHub SDK catalogs"
          body: |
            Automated import of every missing stable release across the registered
            AMD, Intel, and Valve GitHub sources and/or rebuild of immutable
            content-addressed assets.

            The importer resolved exact release tags to commits, downloaded the
            reviewed DLL and legal-document paths from those immutable trees,
            verified PE architecture, Authenticode signer policy, raw and
            Git-blob hashes, and uploaded and HEAD-verified every referenced R2
            asset before opening this PR.
          add-paths: |
            catalogs/libraries/*.lock.json
            libraries/v1/vendors/*.json
            libraries/v1/index.json
