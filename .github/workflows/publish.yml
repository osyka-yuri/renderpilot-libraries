name: Publish

# Validate every JSON manifest against its schema, then — only on main —
# publish the app-fetched JSON to Cloudflare R2. Binaries are uploaded and
# HEAD-verified by the Microsoft refresh workflow before its catalog PR opens;
# JSON-only publication refuses to commit the v1 index if any blob is missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-library-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICROSOFT_NUGET_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

  windows:
    name: Windows PowerShell and PE checks
    if: github.event_name == 'pull_request'
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-library-tools
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:windows

  publish:
    name: Publish immutable snapshots and index to R2
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: libraries-production-r2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-library-tools
      - run: pnpm install --frozen-lockfile
      - name: Publish to R2 (JSON only)
        run: pnpm run publish:json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
